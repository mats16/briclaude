command: ["npm", "run", "start", "--filter=@repo/backend"]

env:
  - name: USER_BASE_DIR
    value: /home/app/users
  - name: SESSION_BASE_DIR
    value: /home/app/sessions
  - name: ENCRYPTION_KEY
    valueFrom: encryption-key-secret
  - name: DATABASE_URL
    valueFrom: database-url-secret
  - name: SQL_WAREHOUSE_ID
    valueFrom: sql-warehouse-2xs
