name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - 'apps/frontend/**'
      - 'packages/types/**'
      - 'packages/eslint-config/**'
      - 'packages/typescript-config/**'
      - 'turbo.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/frontend/**'
      - 'packages/types/**'
      - 'packages/eslint-config/**'
      - 'packages/typescript-config/**'
      - 'turbo.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-ci.yml'

env:
  CACHE_KEY: deps-frontend-${{ github.sha }}
  TURBO_CACHE_KEY: turbo-frontend-${{ hashFiles('**/package-lock.json', 'turbo.json') }}

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-${{ env.TURBO_CACHE_KEY }}
          restore-keys: |
            ${{ runner.os }}-turbo-frontend-

      - name: Build shared packages
        run: npx turbo run build --filter=@repo/types

      - name: Cache dependencies
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            packages/types/dist
            .turbo
          key: ${{ env.CACHE_KEY }}

  lint:
    name: Lint
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            packages/types/dist
            .turbo
          key: ${{ env.CACHE_KEY }}

      - name: Run lint
        run: npx turbo run lint --filter=@repo/frontend

  test:
    name: Test
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            packages/types/dist
            .turbo
          key: ${{ env.CACHE_KEY }}

      - name: Run tests
        run: npx turbo run test --filter=@repo/frontend

  type-check:
    name: Type Check
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore dependencies
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
            packages/types/dist
            .turbo
          key: ${{ env.CACHE_KEY }}

      - name: Run type check
        run: npx turbo run type-check --filter=@repo/frontend
