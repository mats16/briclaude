name: Frontend Lint

on:
  push:
    branches:
      - main
    paths:
      - 'apps/frontend/**'
      - 'packages/types/**'
      - 'packages/eslint-config/**'
      - 'packages/typescript-config/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-lint.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/frontend/**'
      - 'packages/types/**'
      - 'packages/eslint-config/**'
      - 'packages/typescript-config/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/frontend-lint.yml'

jobs:
  lint:
    name: Lint Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build --filter=@repo/types

      - name: Run lint
        run: npm run lint --filter=@repo/frontend
